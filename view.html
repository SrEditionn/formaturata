<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formatura 2026 — Acompanhamento ao vivo</title>
<meta name="robots" content="noindex">
<script>
  document.documentElement.setAttribute('data-theme', 'amoled');
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111116;
    --white: #1A1A22;
    --surface: #1E1E28;
    --text: #EDEDF0;
    --muted: #8E8EA8;
    --border: #272732;
    --green: #34D399;
    --green-light: rgba(52,211,153,.12);
    --accent: #A78BFA;
    --accent-light: rgba(167,139,250,.15);
    --blue: #38BDF8;
    --blue-light: rgba(56,189,248,.14);
    --red: #F87171;
    --gold: #FCD34D;
    --shadow: 0 4px 24px rgba(0,0,0,.85);
    --radius: 16px;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ══ AMOLED OVERRIDES ══ */
  body { background: var(--bg); color: var(--text); }

  /* Setup card */

  /* Header */

  /* Cards/entradas */

  /* Arrecadação cards */
  .arrecadacao-card { background: rgba(52,211,153,.06); border-color: rgba(52,211,153,.2); }
  .arrecadacao-card:hover { border-color: rgba(52,211,153,.4); }
  .arrecadacao-card-name { color: var(--muted); }
  .arrecadacao-card-value { color: #34D399; }

  /* Syncbadge */

  /* PIX Panel */

  .pix-card-bank { color: var(--text); }
  .pix-card-date { color: var(--muted); }

  /* PIX Assign Modal */

  #pixAssignVal { color: #34D399; }
  #pixAssignAlready { background: rgba(48,209,88,.1); border-color: rgba(48,209,88,.25); }
  #pixAssignedLabel { color: var(--text); }

  /* Logs Panel */

  /* Mensal Panel */

  /* Rifas Panel */

  /* Overlays/Modals */
  .modal { background: var(--white); border: 1px solid var(--border); }

  #arrecadacaoActionOverlay > div, #arrecadacaoOverlay > div { background: var(--white); }

  #arrecadacaoActionValAtual { color: #34D399; }

  /* Inputs em dark nos overlays inline */
  input[type="text"], input[type="number"], select {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border);
  }

  /* Totals card */

  /* SYNC BADGE */
  #syncBadge {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 299;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow);
    transition: all .3s;
  }
  #syncBadge.syncing { color: var(--blue); border-color: var(--blue-light); }
  #syncBadge.saved { color: var(--green); border-color: var(--green-light); }
  #syncBadge.error { color: var(--red); }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  /* HEADER */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .header-title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header-title span { color: var(--accent); }
  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }
  .btn-action {
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn-action:hover { opacity: .82; }
  .btn-action.primary { background: var(--accent); color: white; }
  .btn-action.secondary { background: #1C1C1E; color: white; border: 1.5px solid #3a3a45; box-shadow: 0 2px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
  .btn-action.success { background: #30D158; color: white; }

  /* TOTALS */
  .totals-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin: 14px 16px 0;
  }
  /* PIX BUTTON */
  .btn-pix {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(56,189,248,.2) 0%, rgba(56,189,248,.1) 100%);
    border: 1.5px solid rgba(56,189,248,.35);
    border-radius: 14px;
    padding: 14px 20px;
    color: #38BDF8;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    transition: opacity .15s, transform .1s;
    box-shadow: none;
    width: 100%;
  }
  .btn-pix:hover { opacity: .9; transform: translateY(-1px); }
  .btn-pix:active { transform: translateY(0); }
  .pix-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #7fffcc;
    flex-shrink: 0;
    animation: pixPulse 1.6s ease-in-out infinite;
  }
  @keyframes pixPulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .3; transform: scale(.7); }
  }
  .pix-icon { font-size: 20px; }
  .pix-label { flex: 1; text-align: left; }
  .pix-count-badge {
    background: rgba(255,255,255,.25);
    border-radius: 20px;
    padding: 2px 9px;
    font-size: 12px;
    font-weight: 700;
  }

  /* PIX PANEL */
  #pixPanel {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
  }
  #pixPanel.open { display: flex; }
  #pixPanelBg {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.45);
  }
  #pixPanelContent {
    position: relative;
    margin-left: auto;
    width: min(520px, 100%);
    height: 100%;
    background: var(--bg);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    box-shadow: -4px 0 24px rgba(0,0,0,.12);
  }
  #pixPanelHeader {
    background: linear-gradient(180deg, #14141C 0%, #111116 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 18px 14px;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .pix-panel-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .pix-panel-close {
    background: rgba(255,255,255,.08);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 30px; height: 30px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pix-panel-stats {
    display: flex;
    gap: 8px;
  }
  .pix-stat {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }
  .pix-stat-value { font-size: 16px; font-weight: 800; display: block; margin-bottom: 2px; }
  .pix-panel-actions {
    display: flex;
    gap: 8px;
    padding: 12px 16px 0;
  }
  .pix-action-btn {
    background: var(--white);
    border: 1.5px solid #1E1E26;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #38BDF8;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all .15s;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .pix-action-btn:hover { background: rgba(56,189,248,.1); border-color: #38BDF8; }
  .pix-action-btn.active { background: #38BDF8; color: #000000; border-color: #38BDF8; }
  .pix-list {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pix-card {
    background: var(--white);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: none;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: all .15s;
    border: 1px solid var(--border);
  }
  .pix-card:hover { border-color: #38BDF8; transform: translateY(-1px); }
  .pix-card-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(56,189,248,.12);
    border: 1px solid rgba(56,189,248,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .pix-card-body { flex: 1; }
  .pix-card-status { font-size: 10px; font-weight: 700; color: #34D399; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 1px; }
  .pix-card-bank { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 1px; }
  .pix-card-value { font-size: 18px; font-weight: 800; color: #38BDF8; margin-top: 2px; }
  .pix-card-assigned { font-size: 11px; color: #34D399; font-weight: 600; margin-top: 2px; }
  .pix-card-meta { text-align: right; flex-shrink: 0; }
  .pix-card-date { font-size: 11px; color: var(--muted); font-weight: 600; }
  .pix-card-time { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .pix-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .pix-empty-icon { font-size: 40px; margin-bottom: 10px; }
  .pix-empty-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .pix-empty-sub { font-size: 13px; line-height: 1.5; }

  /* PIX ASSIGN MODAL */
  #pixAssignOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 400;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  #pixAssignOverlay.open { opacity: 1; pointer-events: all; }
  #pixAssignModal {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    transform: translateY(30px);
    transition: transform .25s cubic-bezier(.2,.8,.3,1);
  }
  #pixAssignOverlay.open #pixAssignModal { transform: translateY(0); }
  .pix-assign-info {
    background: linear-gradient(135deg, #141428, #0E1428);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pix-assign-info-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .pix-assign-info-val { font-size: 20px; font-weight: 800; color: #38BDF8; }
  .total-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .total-card.main {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .total-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .total-card.main .total-label { color: rgba(255,255,255,.75); }
  .total-value {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .total-card.main .total-value { font-size: 30px; color: white; }
  .total-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .total-card.main .total-sub { color: rgba(255,255,255,.7); }
  .total-icon { font-size: 30px; }
  .total-card.pending {
    grid-column: 1 / -1;
    background: rgba(245,158,11,.06);
    border: 1px solid rgba(245,158,11,.25);
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
  }
  .total-card.pending .total-label { color: #f59e0b; margin-bottom: 1px; }
  .total-card.pending .total-value { font-size: 18px; color: #f59e0b; letter-spacing: -.3px; }
  .total-card.pending .total-icon { font-size: 20px; opacity: .75; }

  /* SECTION */
  .section {
    margin: 20px 16px 0;
    transition: transform .15s, opacity .15s;
  }
  .section.dragging {
    opacity: .5;
  }
  .section.drag-over {
    transform: scale(1.01);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .section-meta {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .drag-handle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    flex-shrink: 0;
  }
  .drag-handle:active { cursor: grabbing; background: var(--accent-light); color: var(--accent); }
  .drag-placeholder {
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    background: var(--accent-light);
    margin: 20px 16px 0;
    box-sizing: border-box;
  }
  .section-name {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text);
    cursor: pointer;
  }
  .section-badge {
    background: var(--blue-light);
    color: var(--blue);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .section-total {
    font-size: 15px;
    font-weight: 700;
    color: var(--green);
  }
  .section-actions { display: flex; gap: 8px; }

  /* btn-icon: limpo, sem cor de fundo, apenas bordinha suave */
  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: all .15s;
  }
  .btn-icon:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,.1); }

  /* CARDS */
  .cards-grid {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .entry-row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    transition: background .1s;
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row:hover { background: #1C1C24; }

  .entry-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .entry-dot.fixed { background: var(--accent); }

  .entry-info { flex: 1; }
  .entry-desc { font-size: 15px; font-weight: 500; }
  .entry-type { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .entry-count { display: flex; align-items: center; gap: 8px; }
  .count-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    transition: all .15s;
    line-height: 1;
  }
  .count-btn.plus { border-color: var(--green); color: var(--green); }
  .count-btn.plus:hover { background: var(--green); color: white; }
  .count-btn.minus { border-color: var(--border); color: var(--muted); }
  .count-btn.minus:hover { border-color: var(--red); color: var(--red); }
  .count-num { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; color: var(--muted); }

  .entry-value { font-size: 15px; font-weight: 700; color: var(--text); min-width: 80px; text-align: right; }

  /* BOTÃO LIXEIRA DA ENTRADA - clean */
  .entry-delete {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    padding: 5px 7px;
    line-height: 1;
    transition: all .15s;
    flex-shrink: 0;
  }
  .entry-delete:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,.1); }

  /* ADD ENTRY */
  .btn-add-entry {
    width: 100%;
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 12px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 10px;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-add-entry:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* MODALS */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 480px;
    transform: translateY(30px);
    transition: transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .overlay.open .modal { transform: translateY(0); }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }

  .type-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-option {
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
  }
  .type-option.selected { border-color: var(--accent); background: var(--accent-light); }
  .type-option-icon { font-size: 22px; margin-bottom: 6px; }
  .type-option-name { font-size: 13px; font-weight: 600; }
  .type-option-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .btn-confirm {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .15s;
  }
  .btn-confirm:hover { opacity: .88; }

  .fixed-value-field { display: none; }
  .fixed-value-field.show { display: block; }

  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-state-icon { font-size: 32px; margin-bottom: 8px; }

  .rename-input {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    border: none;
    border-bottom: 2px solid var(--accent);
    background: transparent;
    outline: none;
    padding: 0 0 2px;
    width: 140px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
  }

  /* RENAME DA ENTRADA (duplo clique no nome da entrada) */
  .entry-desc { cursor: pointer; }
  .rename-input-entry {
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-bottom: 2px solid var(--accent);
    background: transparent;
    outline: none;
    padding: 0 0 2px;
    width: 100%;
    max-width: 220px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
  }

  /* LINK DISCRETO NA ENTRADA (ícone pequeno de redirecionamento) */
  .entry-link-btn {
    background: none;

  </div>
  <div class="totals-row" id="totalsRow"></div>
  <div id="arrecadacoesRow" style="margin:10px 0 0"></div>
</div>

<div id="categoriesContainer"></div>

<div class="footer-note">
  Esta página só exibe os valores — nenhuma edição é feita por aqui.<br>
  Os dados atualizam automaticamente, sem precisar recarregar a página.
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
  import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyDQ0oea2ZrAn_dtzqOWh_BBDQzWQS2Q6eU",
    authDomain: "taterceiro-4bccc.firebaseapp.com",
    projectId: "taterceiro-4bccc",
    storageBucket: "taterceiro-4bccc.firebasestorage.app",
    messagingSenderId: "547692032539",
    appId: "1:547692032539:web:f824159bbbf064af3b3ebe",
    measurementId: "G-C6H410HSJZ"
  });
  const db = getFirestore(app);

  const fmt = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');

  let categories = [];
  let pixLogs = [];
  let arrecadacoes = [];

  function setSyncStatus(state, text) {
    const badge = document.getElementById('syncBadge');
    badge.className = state;
    document.getElementById('syncText').textContent = text;
  }

  function catTotal(cat) {
    return (cat.entries || []).reduce((s, e) => {
      if (e.type === 'fixed') return s + e.value * e.count;
      if (e.type === 'locked') return s + e.value;
      if (e.type === 'withdraw') return s - e.value;
      return s + (e.freeValues || []).reduce((a, b) => a + b, 0);
    }, 0);
  }

  function pendingCashTotal() {
    return categories.reduce((s, c) => s + (c.entries || []).reduce((ss, e) => {
      if (!e.pendingCash) return ss;
      if (e.type === 'fixed') return ss + e.value * e.count;
      if (e.type === 'locked') return ss + e.value;
      if (e.type === 'withdraw') return ss;
      return ss + (e.freeValues || []).reduce((a, b) => a + b, 0);
    }, 0), 0);
  }

  function renderTotals() {
    const total = categories.reduce((s, c) => s + catTotal(c), 0);
    const pending = pendingCashTotal();

    document.getElementById('totalsRow').innerHTML = `
      <div class="total-card main">
        <div>
          <div class="total-label">Total arrecadado</div>
          <div class="total-value">${fmt(total)}</div>
          <div class="total-sub">${categories.length} lista${categories.length !== 1 ? 's' : ''} ativas</div>
        </div>
        <div class="total-icon">🎓</div>
      </div>
      ${pending > 0 ? `
      <div class="total-card pending">
        <div>
          <div class="total-label">Ainda em dinheiro</div>
          <div class="total-value">${fmt(pending)}</div>
        </div>
        <div class="total-icon">⏳</div>
      </div>` : ''}
    `;
  }

  function renderArrecadacoesRow() {
    const row = document.getElementById('arrecadacoesRow');
    let html = '';
    if (arrecadacoes.length > 0) {
      const cards = arrecadacoes.map(a => `
        <div class="arrecadacao-card">
          <div class="arrecadacao-card-label">Meta</div>
          <div class="arrecadacao-card-name">${a.nome}</div>
          <div class="arrecadacao-card-value">${fmt(a.valor)}</div>
        </div>
      `).join('');
      html += `<div class="arrecadacoes-wrap">${cards}</div>`;
    }
    html += `<div style="padding:10px 16px 0"><div class="btn-pix">
      <span class="pix-dot"></span>
      <span class="pix-icon">💸</span>
      <span class="pix-label">Pix Recebido</span>
      <span class="pix-count-badge" style="${pixLogs.length ? '' : 'display:none'}">${pixLogs.length}</span>
    </div></div>`;
    row.innerHTML = html;
  }

  function entryValueLabel(e) {
    if (e.type === 'fixed') return fmt(e.value * e.count);
    if (e.type === 'locked') return fmt(e.value);
    if (e.type === 'withdraw') return '− ' + fmt(e.value);
    return fmt((e.freeValues || []).reduce((a, b) => a + b, 0));
  }

  function entryDotColor(e) {
    if (e.type === 'locked') return '#34D399';
    if (e.type === 'withdraw') return '#F87171';
    if (e.type === 'fixed') return 'var(--accent)';
    return '#f59e0b';
  }

  function entrySubLabel(e) {
    if (e.type === 'fixed') return `${e.count}× · ${fmt(e.value)} por unidade`;
    if (e.type === 'free') {
      const n = (e.freeValues || []).length;
      return `${n} adição${n !== 1 ? 'ões' : ''}`;
    }
    return '';
  }

  function renderEntry(e) {
    const sub = entrySubLabel(e);
    return `
      <div class="entry-row">
        <div class="entry-dot" style="background:${entryDotColor(e)}"></div>
        <div class="entry-info">
          <div class="entry-desc">${e.desc || 'Entrada'}</div>
          ${sub ? `<div class="entry-type">${sub}</div>` : ''}
          ${e.pendingCash ? `<div class="entry-cash-badge" style="font-size:10px;font-weight:600;color:#f59e0b;margin-top:3px;">Falta repassar ao Pix</div>` : ''}
        </div>
        <div class="entry-value" style="${e.type === 'withdraw' ? 'color:var(--red)' : ''}">${entryValueLabel(e)}</div>
      </div>
    `;
  }

  function renderCategory(cat) {
    const total = catTotal(cat);
    const rows = (cat.entries || []).length === 0
      ? `<div class="empty-state"><div class="empty-state-icon">➕</div>Nenhuma entrada ainda</div>`
      : cat.entries.map(e => renderEntry(e)).join('');

    return `
      <div class="section">
        <div class="section-header">
          <div class="section-meta">
            <span class="section-name">${cat.name}</span>
          </div>
          <span class="section-total" style="${total < 0 ? 'color:var(--red)' : ''}">${fmt(total)}</span>
        </div>
        <div class="cards-grid">${rows}</div>
      </div>
    `;
  }

  function render() {
    renderTotals();
    renderArrecadacoesRow();
    const container = document.getElementById('categoriesContainer');
    container.innerHTML = categories.length === 0
      ? `<div class="empty-state" style="margin:20px 16px"><div class="empty-state-icon">📋</div>Nenhuma lista criada ainda</div>`
      : categories.map(renderCategory).join('');
  }

  onSnapshot(doc(db, 'formatura', 'dados'), (snap) => {
    categories = snap.exists() ? (snap.data().categories || []) : [];
    render();
    setSyncStatus('saved', '✓ Ao vivo');
  }, () => setSyncStatus('error', '⚠ Sem conexão'));

  onSnapshot(doc(db, 'formatura', 'pix'), (snap) => {
    pixLogs = snap.exists() ? (snap.data().logs || []) : [];
    render();
  }, () => {});

  onSnapshot(doc(db, 'formatura', 'arrecadacoes'), (snap) => {
    arrecadacoes = snap.exists() ? (snap.data().items || []) : [];
    render();
  }, () => {});
</script>
</body>
</html>
