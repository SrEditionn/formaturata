[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/view"
  to = "/view.html"
  status = 200

[[redirects]]
  from = "/rifa-view"
  to = "/rifa-view.html"
  status = 200

[[redirects]]
  from = "/rifaview"
  to = "/rifa-view.html"
  status = 200

[[redirects]]
  from = "/buffet-view"
  to = "/buffet-view.html"
  status = 200

[[redirects]]
  from = "/buffetview"
  to = "/buffet-view.html"
  status = 200

[[redirects]]
  from = "/buffet"
  to = "/buffet-view.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
